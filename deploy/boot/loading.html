<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Head Unit · Starting</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,sans-serif;color:#fff}body{background:#08040f}
.stage{--bg:#08040f;--bg2:#310c2f;--accent:#ff2a93;--accent2:#56d8ff;--glow:.48;--speed:4s;--fade:0;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 66%,var(--bg2),var(--bg) 75%);perspective:1000px;transition:opacity .45s ease,transform .45s ease;isolation:isolate}
.stage[data-bg="solid"]{background:var(--bg)}.stage[data-bg="gradient"]{background:linear-gradient(140deg,var(--bg),var(--bg2) 60%,var(--bg))}.stage[data-bg="image"]{background:var(--bg)}
.stage[data-bg="grid"]{background:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),radial-gradient(ellipse at 50% 80%,var(--bg2),var(--bg) 75%);background-size:48px 48px,48px 48px,auto}
.wallpaper{position:absolute;inset:0;background-position:center;background-repeat:no-repeat;background-size:cover;opacity:0;pointer-events:none}.stage[data-bg="image"] .wallpaper{opacity:1}.dim{position:absolute;inset:0;background:black;opacity:var(--fade);pointer-events:none}
.aura{position:absolute;width:min(82vw,72vh);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 45%,transparent),transparent 62%);filter:blur(35px);opacity:var(--glow);animation:breath var(--speed) ease-in-out infinite;pointer-events:none}
.particles{position:absolute;inset:-15%;opacity:.4;pointer-events:none;background-image:radial-gradient(circle at 25% 20%,var(--accent) 0 1px,transparent 2px),radial-gradient(circle at 80% 70%,var(--accent2) 0 1px,transparent 2px),radial-gradient(circle at 53% 43%,var(--accent) 0 1px,transparent 2px);background-size:240px 170px;animation:drift 12s linear infinite}
.visual{position:absolute;left:var(--posx);top:var(--posy);width:var(--size);max-height:85vh;transform:translate(-50%,-50%);display:flex;justify-content:center;align-items:center;pointer-events:none;z-index:1}
.mascot{width:100%;max-height:85vh;object-fit:contain;opacity:var(--opacity);filter:drop-shadow(0 0 calc(var(--glow) * 40px) var(--accent));transform:scaleX(var(--mirror));will-change:transform;transform-origin:center}
.stage[data-motion="float"] .mascot{animation:float var(--speed) ease-in-out infinite}.stage[data-motion="pulse"] .mascot{animation:beat var(--speed) ease-in-out infinite}.stage[data-motion="tilt"] .mascot{animation:tilt var(--speed) ease-in-out infinite}.stage[data-motion="orbit"] .mascot{animation:orbit var(--speed) ease-in-out infinite}.stage[data-motion="hologram"] .mascot{animation:hologram var(--speed) ease-in-out infinite}
.copy{position:absolute;bottom:6%;width:min(86vw,700px);left:50%;transform:translateX(-50%);z-index:3;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;text-shadow:0 2px 16px #000}
h1{font-weight:850;font-size:var(--title-size);letter-spacing:.27em;margin:0;padding-left:.27em;text-shadow:0 0 26px var(--accent);line-height:1.2}p{margin:0;font-size:clamp(11px,1.3vw,17px);letter-spacing:.14em;color:color-mix(in srgb,var(--accent) 65%,white);text-transform:uppercase}
.stage[data-font="clean"] h1{letter-spacing:.015em;padding-left:0}.stage[data-font="clean"] p{letter-spacing:.025em;text-transform:none}.stage[data-font="mono"] h1,.stage[data-font="mono"] p{font-family:monospace;letter-spacing:.10em}
.loader{margin-top:13px;display:flex;align-items:center;justify-content:center;width:min(36vw,360px);height:25px}.track{width:100%;height:4px;background:color-mix(in srgb,var(--accent) 24%,transparent);border-radius:99px;overflow:hidden}.fill{height:100%;width:32%;border-radius:99px;background:linear-gradient(90deg,var(--accent2),var(--accent));box-shadow:0 0 18px var(--accent);animation:sweep 1.8s ease-in-out infinite}.ring{width:28px;height:28px;border:3px solid color-mix(in srgb,var(--accent) 25%,transparent);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}.dots{display:flex;gap:12px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--accent);animation:blink 1.2s ease-in-out infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}.scanner{height:3px;width:100%;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:scan 1.5s ease-in-out infinite}.stage[data-loader="ring"] .track,.stage[data-loader="ring"] .dots,.stage[data-loader="ring"] .scanner,.stage[data-loader="dots"] .track,.stage[data-loader="dots"] .ring,.stage[data-loader="dots"] .scanner,.stage[data-loader="scanner"] .track,.stage[data-loader="scanner"] .ring,.stage[data-loader="scanner"] .dots,.stage[data-loader="bar"] .ring,.stage[data-loader="bar"] .dots,.stage[data-loader="bar"] .scanner,.stage[data-loader="none"] .loader{display:none}
.wait-note{color:#ddd;font-size:11px;letter-spacing:0;text-transform:none;max-width:70vw;margin-top:8px}
.stage.hide-mascot .visual{display:none}.stage.no-particles .particles{display:none}.stage.no-status #status{display:none}
.stage.is-leaving[data-transition="fade"]{opacity:0}.stage.is-leaving[data-transition="zoom"]{opacity:0;transform:scale(1.06)}
@keyframes breath{50%{transform:scale(1.2);opacity:.2}}@keyframes drift{to{transform:translate3d(6%,3%,0)}}@keyframes float{50%{transform:translateY(-12px) scaleX(var(--mirror))}}@keyframes beat{50%{transform:scale(1.05) scaleX(var(--mirror))}}@keyframes tilt{50%{transform:rotateY(11deg) rotateZ(-2deg) scaleX(var(--mirror))}}@keyframes orbit{50%{transform:rotateZ(5deg) translateY(-6px) scaleX(var(--mirror))}}@keyframes hologram{0%,100%{opacity:var(--opacity)}50%{opacity:.68;filter:drop-shadow(0 0 28px var(--accent)) hue-rotate(25deg)}}@keyframes sweep{0%{transform:translateX(-110%)}100%{transform:translateX(410%)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes blink{50%{transform:scale(1.6);opacity:.3}}@keyframes scan{50%{transform:scaleX(.35)}}
@media (prefers-reduced-motion:reduce){.mascot,.aura,.particles,.fill,.ring,.dots i,.scanner{animation:none!important}}
</style><script src="boot-config.js"></script></head>
<body><main id="stage" class="stage" data-bg="aurora" data-motion="float" data-loader="bar" data-font="wide" data-transition="fade"><div class="wallpaper" id="wallpaper"></div><div class="particles"></div><div class="aura"></div><div class="dim"></div><div class="visual"><img class="mascot" id="mascot" src="art/armored.webp" alt="Head Unit mascot"></div><div class="copy"><h1 id="boot-title">HEAD UNIT</h1><p id="status" role="status">Starting system</p><div class="loader"><div class="track"><div class="fill"></div></div><div class="ring"></div><div class="dots"><i></i><i></i><i></i></div><div class="scanner"></div></div><small id="timeout" class="wait-note" hidden>Still starting — check your head-unit service if this persists.</small></div></main>
<script src="boot-runtime.js"></script></body></html>
