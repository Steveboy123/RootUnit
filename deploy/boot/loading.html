<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Head Unit · Starting</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,sans-serif;color:#fff}body{background:#08040f}
.stage{--bg:#08040f;--bg2:#310c2f;--accent:#ff2a93;--accent2:#56d8ff;--glow:.48;--speed:4s;--fade:0;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 66%,var(--bg2),var(--bg) 75%);perspective:1000px;transition:opacity .45s ease,transform .45s ease;isolation:isolate}
.stage[data-bg="solid"]{background:var(--bg)}.stage[data-bg="gradient"]{background:linear-gradient(140deg,var(--bg),var(--bg2) 60%,var(--bg))}.stage[data-bg="image"]{background:var(--bg)}
.stage[data-bg="grid"]{background:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),radial-gradient(ellipse at 50% 80%,var(--bg2),var(--bg) 75%);background-size:48px 48px,48px 48px,auto}
.wallpaper{position:absolute;inset:0;background-position:center;background-repeat:no-repeat;background-size:cover;opacity:0;pointer-events:none}.stage[data-bg="image"] .wallpaper{opacity:1}.dim{position:absolute;inset:0;background:black;opacity:var(--fade);pointer-events:none}
.aura{position:absolute;width:min(82vw,72vh);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 45%,transparent),transparent 62%);filter:blur(35px);opacity:var(--glow);animation:breath var(--speed) ease-in-out infinite;pointer-events:none}
.particles{position:absolute;inset:-15%;opacity:.4;pointer-events:none;background-image:radial-gradient(circle at 25% 20%,var(--accent) 0 1px,transparent 2px),radial-gradient(circle at 80% 70%,var(--accent2) 0 1px,transparent 2px),radial-gradient(circle at 53% 43%,var(--accent) 0 1px,transparent 2px);background-size:240px 170px;animation:drift 12s linear infinite}
.visual{position:absolute;left:var(--posx);top:var(--posy);width:var(--size);max-height:85vh;transform:translate(-50%,-50%);display:flex;justify-content:center;align-items:center;pointer-events:none;z-index:1}
.mascot{width:100%;max-height:85vh;object-fit:contain;opacity:var(--opacity);filter:drop-shadow(0 0 calc(var(--glow) * 40px) var(--accent));transform:scaleX(var(--mirror));will-change:transform;transform-origin:center}
.stage[data-motion="float"] .mascot{animation:float var(--speed) ease-in-out infinite}.stage[data-motion="pulse"] .mascot{animation:beat var(--speed) ease-in-out infinite}.stage[data-motion="tilt"] .mascot{animation:tilt var(--speed) ease-in-out infinite}.stage[data-motion="orbit"] .mascot{animation:orbit var(--speed) ease-in-out infinite}.stage[data-motion="hologram"] .mascot{animation:hologram var(--speed) ease-in-out infinite}
.copy{position:absolute;bottom:6%;width:min(86vw,700px);left:50%;transform:translateX(-50%);z-index:3;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;text-shadow:0 2px 16px #000}
h1{font-weight:850;font-size:var(--title-size);letter-spacing:.27em;margin:0;padding-left:.27em;text-shadow:0 0 26px var(--accent);line-height:1.2}p{margin:0;font-size:clamp(11px,1.3vw,17px);letter-spacing:.14em;color:color-mix(in srgb,var(--accent) 65%,white);text-transform:uppercase}
.stage[data-font="clean"] h1{letter-spacing:.015em;padding-left:0}.stage[data-font="clean"] p{letter-spacing:.025em;text-transform:none}.stage[data-font="mono"] h1,.stage[data-font="mono"] p{font-family:monospace;letter-spacing:.10em}
.loader{margin-top:13px;display:flex;align-items:center;justify-content:center;width:min(36vw,360px);height:25px}.track{width:100%;height:4px;background:color-mix(in srgb,var(--accent) 24%,transparent);border-radius:99px;overflow:hidden}.fill{height:100%;width:32%;border-radius:99px;background:linear-gradient(90deg,var(--accent2),var(--accent));box-shadow:0 0 18px var(--accent);animation:sweep 1.8s ease-in-out infinite}.ring{width:28px;height:28px;border:3px solid color-mix(in srgb,var(--accent) 25%,transparent);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}.dots{display:flex;gap:12px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--accent);animation:blink 1.2s ease-in-out infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}.scanner{height:3px;width:100%;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:scan 1.5s ease-in-out infinite}.loader>*{display:none}.stage[data-loader="bar"] .track,.stage[data-loader="ring"] .ring,.stage[data-loader="dots"] .dots,.stage[data-loader="scanner"] .scanner,.stage[data-loader="pulse"] .pulse,.stage[data-loader="wave"] .wave,.stage[data-loader="segments"] .segments,.stage[data-loader="orbit"] .orbit,.stage[data-loader="heartbeat"] .heartbeat{display:flex}.stage[data-loader="none"] .loader{display:none}
.wait-note{color:#ddd;font-size:11px;letter-spacing:0;text-transform:none;max-width:70vw;margin-top:8px}
.stage.hide-mascot .visual{display:none}.stage.no-particles .particles{display:none}.stage.no-status #status{display:none}
.stage.is-leaving[data-transition="fade"]{opacity:0}.stage.is-leaving[data-transition="zoom"]{opacity:0;transform:scale(1.06)}
@keyframes breath{50%{transform:scale(1.2);opacity:.2}}@keyframes drift{to{transform:translate3d(6%,3%,0)}}@keyframes float{50%{transform:translateY(-12px) scaleX(var(--mirror))}}@keyframes beat{50%{transform:scale(1.05) scaleX(var(--mirror))}}@keyframes tilt{50%{transform:rotateY(11deg) rotateZ(-2deg) scaleX(var(--mirror))}}@keyframes orbit{50%{transform:rotateZ(5deg) translateY(-6px) scaleX(var(--mirror))}}@keyframes hologram{0%,100%{opacity:var(--opacity)}50%{opacity:.68;filter:drop-shadow(0 0 28px var(--accent)) hue-rotate(25deg)}}@keyframes sweep{0%{transform:translateX(-110%)}100%{transform:translateX(410%)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes blink{50%{transform:scale(1.6);opacity:.3}}@keyframes scan{50%{transform:scaleX(.35)}}
@media (prefers-reduced-motion:reduce){.mascot,.aura,.particles,.fill,.ring,.dots i,.scanner{animation:none!important}}

/* RootUnit additions: backgrounds */
.scene{position:absolute;inset:0;pointer-events:none;display:none;overflow:hidden}
.stage[data-bg="stars"]{background:radial-gradient(ellipse at 50% 120%,var(--bg2),var(--bg) 70%)}.stage[data-bg="stars"] .scene.stars{display:block;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.5px),radial-gradient(circle,color-mix(in srgb,var(--accent2) 80%,white) 0 1px,transparent 1.5px),radial-gradient(circle,#fff 0 .7px,transparent 1.2px);background-size:180px 140px,260px 210px,90px 80px;background-position:0 0,40px 70px,20px 30px;animation:twinkle 4s ease-in-out infinite alternate}
.stage[data-bg="warp"]{background:radial-gradient(circle at 50% 50%,var(--bg2),var(--bg) 60%)}.stage[data-bg="warp"] .scene.warp{display:block;background:repeating-conic-gradient(from 0deg at 50% 50%,transparent 0 5.5deg,color-mix(in srgb,var(--accent2) 55%,transparent) 5.8deg,transparent 6.3deg);-webkit-mask:radial-gradient(circle at 50% 50%,transparent 6%,#000 40%);mask:radial-gradient(circle at 50% 50%,transparent 6%,#000 40%);animation:warp 1.6s linear infinite}
.stage[data-bg="mesh"]{background:radial-gradient(at 18% 22%,color-mix(in srgb,var(--accent) 45%,transparent),transparent 55%),radial-gradient(at 82% 30%,color-mix(in srgb,var(--accent2) 40%,transparent),transparent 55%),radial-gradient(at 50% 90%,var(--bg2),transparent 60%),var(--bg)}
.stage[data-bg="synthsun"]{background:linear-gradient(var(--bg) 0%,var(--bg2) 58%,var(--bg) 58.2%)}.stage[data-bg="synthsun"] .scene.sun{display:block}
.sun i{position:absolute;left:50%;top:22%;width:min(46vh,40vw);aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:linear-gradient(#ffe36a,var(--accent));-webkit-mask:linear-gradient(#000 52%,transparent 52% 56%,#000 56% 64%,transparent 64% 68%,#000 68% 76%,transparent 76% 81%,#000 81% 89%,transparent 89%);mask:linear-gradient(#000 52%,transparent 52% 56%,#000 56% 64%,transparent 64% 68%,#000 68% 76%,transparent 76% 81%,#000 81% 89%,transparent 89%);box-shadow:0 0 80px var(--accent)}
.sun b{position:absolute;left:0;right:0;top:58%;bottom:0;overflow:hidden;perspective:300px}.sun b::before{content:'';position:absolute;left:-60%;right:-60%;top:0;height:320%;background-image:linear-gradient(color-mix(in srgb,var(--accent) 70%,transparent) 2px,transparent 2px),linear-gradient(90deg,color-mix(in srgb,var(--accent) 70%,transparent) 2px,transparent 2px);background-size:60px 40px;transform:rotateX(62deg) translateY(-40px);transform-origin:50% 0;animation:roll 1.2s linear infinite}
/* motions */
.stage[data-motion="glitch"] .mascot{animation:glitch calc(var(--speed) * .6) steps(1) infinite}.stage[data-motion="breathe"] .mascot{animation:beat calc(var(--speed) * 1.3) ease-in-out infinite}.stage[data-motion="spin3d"] .mascot{animation:spin3d calc(var(--speed) * 1.6) linear infinite}
/* lettering */
.stage[data-font="neon"] h1{font-weight:300;color:color-mix(in srgb,var(--accent) 35%,white);text-shadow:0 0 6px var(--accent),0 0 22px var(--accent),0 0 48px var(--accent)}
.stage[data-font="outline"] h1{color:transparent;-webkit-text-stroke:1.5px var(--accent);text-shadow:none}
.stage[data-font="future"] h1{font-weight:300;letter-spacing:.5em;padding-left:.5em}.stage[data-font="future"] p{letter-spacing:.32em}
.stage[data-font="glitch"] h1{position:relative;animation:jitter 2.4s steps(1) infinite}.stage[data-font="glitch"] h1::before,.stage[data-font="glitch"] h1::after{content:attr(data-text);position:absolute;inset:0;padding-left:.27em}.stage[data-font="glitch"] h1::before{color:var(--accent2);transform:translate(-2px,0);clip-path:inset(0 0 55% 0);opacity:.8}.stage[data-font="glitch"] h1::after{color:var(--accent);transform:translate(2px,0);clip-path:inset(55% 0 0 0);opacity:.8}
/* loaders */
.pulse{width:26px;height:26px;border-radius:50%;background:var(--accent);box-shadow:0 0 22px var(--accent);animation:pop 1.1s ease-in-out infinite}
.wave{gap:5px;align-items:flex-end;height:24px}.wave i{width:5px;height:100%;border-radius:3px;background:var(--accent);transform-origin:50% 100%;animation:eq 1s ease-in-out infinite}.wave i:nth-child(2){animation-delay:-.2s}.wave i:nth-child(3){animation-delay:-.4s}.wave i:nth-child(4){animation-delay:-.6s}.wave i:nth-child(5){animation-delay:-.8s}
.segments{gap:5px}.segments i{width:20px;height:6px;border-radius:2px;background:var(--accent);opacity:.18;animation:seg 1.6s linear infinite}.segments i:nth-child(2){animation-delay:.2s}.segments i:nth-child(3){animation-delay:.4s}.segments i:nth-child(4){animation-delay:.6s}.segments i:nth-child(5){animation-delay:.8s}.segments i:nth-child(6){animation-delay:1s}.segments i:nth-child(7){animation-delay:1.2s}.segments i:nth-child(8){animation-delay:1.4s}
.orbit{position:relative;width:30px;height:30px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--accent) 30%,transparent);animation:spin 1.1s linear infinite}.orbit i{position:absolute;top:-4px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.heartbeat{width:100%;height:25px;overflow:hidden;-webkit-mask:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent);mask:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent)}.heartbeat svg{flex:none;width:200%;height:100%;animation:ecg 1.8s linear infinite}.heartbeat path{fill:none;stroke:var(--accent);stroke-width:2.2;filter:drop-shadow(0 0 4px var(--accent))}
/* hand-over */
.stage.is-leaving[data-transition="slide"]{opacity:0;transform:translateX(-8%)}.stage.is-leaving[data-transition="iris"]{clip-path:circle(0% at 50% 50%)}.stage[data-transition="iris"]{clip-path:circle(150% at 50% 50%);transition:clip-path .45s ease,opacity .45s ease}.stage.is-leaving[data-transition="warp"]{opacity:0;transform:scale(1.5)}
.shutter{position:absolute;inset:0;pointer-events:none;z-index:9}.shutter::before,.shutter::after{content:'';position:absolute;left:0;right:0;height:50%;background:#000;transform:scaleY(0)}.shutter::before{top:0;transform-origin:50% 0}.shutter::after{bottom:0;transform-origin:50% 100%}.stage.is-leaving[data-transition="shutter"] .shutter::before,.stage.is-leaving[data-transition="shutter"] .shutter::after{transform:scaleY(1);transition:transform var(--leave,.4s) ease-in}
@keyframes twinkle{to{opacity:.55}}@keyframes warp{to{transform:scale(1.35)}}@keyframes roll{to{transform:rotateX(62deg) translateY(0)}}@keyframes pop{50%{transform:scale(.55);opacity:.45}}@keyframes glitch{0%,100%{transform:scaleX(var(--mirror))}20%{transform:translate(-6px,2px) scaleX(var(--mirror))}22%{transform:translate(5px,-2px) scaleX(var(--mirror))}24%{transform:scaleX(var(--mirror))}70%{transform:translate(3px,0) skewX(-4deg) scaleX(var(--mirror))}72%{transform:scaleX(var(--mirror))}}@keyframes spin3d{to{transform:rotateY(360deg) scaleX(var(--mirror))}}@keyframes jitter{0%,100%{transform:none}48%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}52%{transform:none}}@keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}@keyframes seg{0%,30%{opacity:1}31%,100%{opacity:.18}}@keyframes ecg{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.scene,.sun b::before,.pulse,.wave i,.segments i,.orbit,.heartbeat svg,.stage h1{animation:none!important}}
</style><script src="boot-config.js"></script></head>
<body><main id="stage" class="stage" data-bg="aurora" data-motion="float" data-loader="bar" data-font="wide" data-transition="fade"><div class="wallpaper" id="wallpaper"></div><div class="scene stars"></div><div class="scene warp"></div><div class="scene sun"><i></i><b></b></div><div class="particles"></div><div class="aura"></div><div class="dim"></div><div class="visual"><img class="mascot" id="mascot" src="art/armored.webp" alt="Head Unit mascot"></div><div class="copy"><h1 id="boot-title" data-text="HEAD UNIT">HEAD UNIT</h1><p id="status" role="status">Starting system</p><div class="loader"><div class="track"><div class="fill"></div></div><div class="ring"></div><div class="dots"><i></i><i></i><i></i></div><div class="scanner"></div><div class="pulse"></div><div class="wave"><i></i><i></i><i></i><i></i><i></i></div><div class="segments"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="orbit"><i></i></div><div class="heartbeat"><svg viewBox="0 0 400 25" preserveAspectRatio="none"><path d="M0 14H40L46 4L52 22L58 14H140L146 4L152 22L158 14H200H240L246 4L252 22L258 14H340L346 4L352 22L358 14H400"/></svg></div></div><small id="timeout" class="wait-note" hidden>Still starting — check your head-unit service if this persists.</small></div><div class="shutter"></div></main>
<script src="boot-runtime.js"></script></body></html>
