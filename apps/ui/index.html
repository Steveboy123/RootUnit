<!doctype html>
<html lang="en" data-theme="obsidian" data-scheme="dark" data-surface="glass" data-bg="mesh" data-effects="balanced" data-shape="soft">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#08080d" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23a66bff'/%3E%3Cstop offset='1' stop-color='%23ff6bd8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Crect x='11' y='11' width='10' height='10' rx='3' fill='%2308080d'/%3E%3C/svg%3E" />
    <title>RootUnit</title>
  </head>
  <body style="margin:0;background:#08080d;font-family:system-ui,-apple-system,sans-serif;overflow:hidden">
    <div id="root" style="min-height:100vh">
      <div id="boot-fallback" style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:radial-gradient(ellipse at 50% 45%,#2c0b2a 0%,#08040f 62%);color:white">
        <img src="/mascot/armored.webp" alt="" style="width:min(48vw,56vh,460px);object-fit:contain" />
        <div style="font-size:24px;font-weight:800;letter-spacing:.32em;margin-top:-18px">ROOTUNIT</div>
        <div id="boot-status" style="margin-top:10px;color:#ff94c2">Loading…</div>
      </div>
    </div>
    <script>
      (() => {
        const show = (message) => {
          const el = document.getElementById('boot-status');
          if (el) el.textContent = message;
        };
        window.addEventListener('error', (event) => {
          const msg = event && (event.message || (event.error && event.error.message));
          show('UI startup error: ' + (msg || 'script failed to load'));
        });
        window.addEventListener('unhandledrejection', (event) => {
          const reason = event && event.reason;
          show('UI startup error: ' + (reason && reason.message ? reason.message : String(reason || 'unknown error')));
        });
        setTimeout(() => {
          if (document.getElementById('boot-fallback')) show('The interface did not start. The backend is running — check the Chromium log.');
        }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
